<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メニュー</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}


/* 少し暗くする */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.35);
    z-index:-1;
}

body{
    color:white;
    text-align:center;

    background-image:url("background.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

/* 上のロゴ */
.logo{
    width:320px;
    max-width:100%;
    margin-top:30px;
    margin-bottom:40px;
}

/* ボタン全体 */
.menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:35px;
    width:90%;
    max-width:800px;
    margin:auto;
}

/* ボタン */
.card{
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(8px);
    border-radius:25px;
    padding:20px;
    border:2px solid rgba(255,255,255,0.4);
    transition:.3s;
    cursor:pointer;
}

.card:hover{
    transform:scale(1.05);
    background:rgba(255,255,255,0.28);
}

/* ボタン内画像 */
.card img,
.card video{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:18px;
}

/* タイトル */
.title{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
}
</style>
</head>

<body>


<div class="overlay"></div>

<!-- 一番上の画像 -->
<img src="logo.png" class="logo">

<div class="menu">

<div class="card" onclick="location.href='page1.html'">
    <video autoplay muted loop>
        <source src="movie1.mp4">
    </video>
    <!-- 動画なら↓に変更
    <video autoplay muted loop>
        <source src="movie1.mp4">
    </video>
    -->
    <div class="title">外装の設計</div>
</div>

<div class="card" onclick="location.href='page2.html'">
    <video autoplay muted loop>
        <source src="movie2.mp4">
    </video>
    <div class="title">スリットアニメーション</div>
</div>

<div class="card" onclick="location.href='https://forms.gle/71V3Sac8LSARrr2T6'">
    <img src="image3.jpg">
    <div class="title">会計報告</div>
</div>

<div class="card" onclick="location.href='https://docs.google.com/spreadsheets/d/1zdQbnROVTSEt7m-zxs66n1s2eNdGSYr5-081BE0svz0/edit?usp=sharing'">
    <img src="image4.jpg">
    <div class="title">お買い物リスト</div>
</div>

</div>

</body>
</html>
