<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勉強部屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eaf6fb;
    --bg-soft: #f4fbfd;
    --card: #ffffff;
    --ink: #274653;
    --ink-soft: #5b7c88;
    --primary: #3aa6c7;
    --primary-dark: #226e8a;
    --line: #cfeaf2;
    --shadow: 0 8px 24px rgba(58,166,199,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 0%, #ffffff 0%, transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px;}

  header.top{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
  .logo-tab{
    width:14px;height:44px;border-radius:6px;
    background:linear-gradient(180deg,#7fd4ec,#3aa6c7);
    box-shadow:var(--shadow);
    flex-shrink:0;
  }
  h1.title{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;font-size:32px;margin:0;
    color:var(--primary-dark);letter-spacing:.02em;
  }
  p.subtitle{margin:6px 0 32px 28px;color:var(--ink-soft);font-size:14px;}

  #home-view .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:18px;
  }
  .subject-card{
    position:relative;background:var(--card);border-radius:14px;
    box-shadow:var(--shadow);padding:22px 16px 18px;cursor:pointer;
    border:1px solid var(--line);
    transition:transform .15s ease, box-shadow .15s ease;
    overflow:hidden;min-height:110px;
  }
  .subject-card:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(58,166,199,0.22);}
  .subject-card:focus-visible{outline:3px solid var(--primary-dark);outline-offset:2px;}
  .subject-card .tab{position:absolute;top:0;left:0;right:0;height:8px;}
  .subject-card .name{
    font-family:'Zen Maru Gothic', sans-serif;font-weight:700;
    font-size:19px;margin-top:8px;color:var(--ink);
  }
  .subject-card .count{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .subject-card .del-btn{
    position:absolute;top:14px;right:12px;background:none;border:none;
    color:#b7cdd4;font-size:13px;cursor:pointer;line-height:1;
    opacity:0;transition:opacity .15s, color .15s;
    padding:4px 6px;border-radius:6px;
  }
  .subject-card:hover .del-btn{opacity:1;}
  .subject-card .del-btn:hover{color:#e07a7a;background:#fdecec;}
  .subject-card .del-btn.confirming{
    opacity:1;color:#c0392b;background:#fdecec;font-weight:700;font-size:11px;
  }

  .add-card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    border:2px dashed #a9d9e8;border-radius:14px;min-height:110px;
    color:var(--primary-dark);font-weight:700;cursor:pointer;
    background:transparent;font-family:'Zen Maru Gothic', sans-serif;font-size:15px;
    padding:16px;
  }
  .add-card:hover{background:#e2f4fa;}
  .add-card.editing{cursor:default;background:#fff;border-style:solid;}
  .add-card input[type=text]{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    font-size:14px;font-family:'Noto Sans JP', sans-serif;color:var(--ink);
  }
  .add-card .add-form-buttons{display:flex;gap:8px;width:100%;}
  .add-card .add-form-buttons button{
    flex:1;border:none;border-radius:8px;padding:7px 0;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .add-card .confirm-btn{background:var(--primary);color:#fff;}
  .add-card .confirm-btn:hover{background:var(--primary-dark);}
  .add-card .cancel-btn{background:#eef6f9;color:var(--ink-soft);}
  .add-card .cancel-btn:hover{background:#dcedf3;}

  #subject-view{display:none;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;background:var(--card);
    border:1px solid var(--line);color:var(--primary-dark);font-weight:700;
    font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;
    box-shadow:0 2px 8px rgba(58,166,199,0.12);margin-bottom:20px;
  }
  .back-btn:hover{background:#e2f4fa;}

  .subject-header{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .subject-header .tab-chip{width:12px;height:34px;border-radius:5px;}
  .subject-header h2{
    font-family:'Zen Maru Gothic', sans-serif;font-size:26px;margin:0;color:var(--ink);
  }

  section.panel{
    background:var(--card);border-radius:16px;padding:22px;
    box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:22px;
  }
  section.panel h3{
    font-family:'Zen Maru Gothic', sans-serif;font-size:16px;margin:0 0 4px;color:var(--primary-dark);
  }
  section.panel .desc{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;line-height:1.6;}

  .upload-btn-link{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--primary);color:#fff;text-decoration:none;
    padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;
    box-shadow:0 4px 12px rgba(58,166,199,0.25);
  }
  .upload-btn-link:hover{background:var(--primary-dark);}
  .upload-btn-link{width:100%;justify-content:center;}
  .upload-embed{
    margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  }
  .upload-embed iframe{width:100%;height:320px;border:none;display:block;background:#fff;}
  .upload-embed .embed-label{
    font-size:11px;color:var(--ink-soft);background:var(--bg-soft);
    padding:6px 12px;border-bottom:1px solid var(--line);
  }
  .embed-fallback-note{
    font-size:11.5px;color:var(--ink-soft);background:var(--bg-soft);
    padding:8px 12px;border-top:1px solid var(--line);line-height:1.6;
  }
  @media (max-width:640px){
    .upload-embed iframe{height:380px;}
  }
  .unset-note{
    background:var(--bg-soft);border:1px dashed var(--line);border-radius:10px;
    padding:12px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.6;
  }
  .unset-note code{background:#dff1f7;padding:1px 6px;border-radius:4px;}

  .status-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--bg-soft);border:1px dashed var(--line);
    border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--ink-soft);
    margin-bottom:16px;gap:10px;
  }
  .status-row button{
    background:var(--primary);color:#fff;border:none;padding:6px 14px;
    border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;
  }
  .status-row button:hover{background:var(--primary-dark);}

  .item-list{display:flex;flex-direction:column;gap:12px;}
  .item-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg-soft);}
  .item-card .item-head{
    display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:13.5px;gap:8px;
  }
  .item-card .item-name{
    font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
  }
  .item-card .badge{
    font-size:10.5px;background:#4a5b78;color:#fff;padding:2px 8px;
    border-radius:999px;flex-shrink:0;
  }
  .item-card .item-actions{display:flex;gap:8px;flex-shrink:0;}
  .item-card .item-actions button, .item-card .item-actions a{
    font-size:12px;border:none;background:none;color:var(--primary-dark);
    cursor:pointer;text-decoration:underline;padding:0;white-space:nowrap;
  }
  .item-card .preview-box{display:none;border-top:1px solid var(--line);}
  .item-card .preview-box.open{display:block;}
  .item-card iframe.pdf-frame{width:100%;height:420px;border:none;display:block;background:#fff;}
  .empty-note{font-size:13px;color:var(--ink-soft);padding:4px 2px;}
</style>
</head>
<body>
<div class="wrap">

  <div id="home-view">
    <header class="top">
      <div class="logo-tab"></div>
      <h1 class="title">勉強部屋</h1>
    </header>
    <p class="subtitle">科目を選んで、教材のアップロードと閲覧をしよう</p>
    <div class="grid" id="subject-grid"></div>
  </div>

  <div id="subject-view">
    <button class="back-btn" id="back-btn">← ホームに戻る</button>

    <div class="subject-header">
      <div class="tab-chip" id="subject-tab-chip"></div>
      <h2 id="subject-title"></h2>
    </div>

    <section class="panel">
      <h3>📤 新しくアップロードする</h3>
      <p class="desc" id="upload-desc"></p>
      <div id="upload-area"></div>
    </section>

    <section class="panel">
      <h3>🗂 この科目の資料</h3>
      <p class="desc">このHTMLと同じGitHubリポジトリ内のPDFを自動で一覧表示します（プレビュー付き）。</p>
      <div class="status-row">
        <span id="github-status">読み込み待機中</span>
        <button id="github-refresh-btn">再読み込み</button>
      </div>
      <div class="item-list" id="item-list"></div>
      <p class="empty-note" id="empty-note">まだ資料がありません。</p>
    </section>
  </div>

</div>

<script>
  // =====================================================================
  // 設定エリア（このHTMLを使う前に編集してください）
  // =====================================================================

  // ① 資料を自動で一覧表示するためのGitHub設定
  //    このHTMLと同じリポジトリの「folder/科目名/」の中にあるPDFを自動取得します
  //    例）pdfs/国語/こくご1.pdf
  const GITHUB_CONFIG = {
    enabled: false,
    user: "your-github-username",
    repo: "your-repo-name",
    branch: "main",
    folder: "pdfs"
  };

  // ② 新規アップロード先のGoogleドライブ フォルダ（科目名ごとに指定）
  //    フォルダの共有設定は「リンクを知っている全員」＋権限「編集者」にしてください
  //    そうすることで、このリンクを開いた人が直接ファイルをアップロードできます
  //    ※フォルダの中身一覧は表示せず、ボタンのみ表示します（アップロードした人の名前が
  //      画面に出ないようにするため。詳しくは会話内の説明をご覧ください）
  const DRIVE_UPLOAD_FOLDERS = {
    "国語": "https://drive.google.com/drive/folders/1UPnYfrBrStQm9CA_DHcisjkst1B8QEC_?usp=sharing",
    "数学": "https://drive.google.com/drive/folders/1NWyFrwLteOpnyfgZi4HRFDKzd9h5q3F7?usp=sharing",
    "英語": "https://drive.google.com/drive/folders/14K80sHkrf4-qxe4VfvamETVWua0h74e2?usp=sharing",
    "物理": "https://drive.google.com/drive/folders/1PGZKY8dLZxkAN9yYYOPvFHcF85vZGciU?usp=sharing",
    "化学": "https://drive.google.com/drive/folders/1h88OMYs8ebHuITNoRByApeZ6AAJfvWfb?usp=sharing",
    "日本史": "https://drive.google.com/drive/folders/1BvRIcS8skb2vQmH-GGeEHSxjE2CwnMZu?usp=sharing",
    "世界史": "https://drive.google.com/drive/folders/1VbbXX8AtctGTh9fqvd6P61UOu1mq6NMu?usp=sharing",
    "地理": "https://drive.google.com/drive/folders/1hopn6BqmjxV2bQvRGAG60kU122hqsPQ6?usp=sharing",
    "政経": "https://drive.google.com/drive/folders/1ammpEykzEsL-IstMGdZLZraLzxpkD9I5?usp=sharing",
    "過去問": "https://drive.google.com/drive/folders/1A_ab6Kv48MYoBRfCjz842DBSkblmT-1N?usp=sharing"
    // 新しい科目を追加した場合は、ここにも "科目名": "フォルダのURL" を追加してください
  };

  const TAB_COLORS = ["#f6a5a5","#f9c66b","#8fd19e","#7ec8e3","#b39ddb","#f49ac2","#ffab91","#a3d9a5","#90caf9","#ce93d8"];

  function cid(){ return 'id-' + Math.random().toString(36).slice(2,10); }

  function makeSubject(name, idx){
    return { id: cid(), name, color: TAB_COLORS[idx % TAB_COLORS.length], githubItems: [] };
  }

  let state = {
    subjects: ["国語","数学","英語","物理","化学","日本史","世界史","地理","政経","過去問"]
      .map((name, i) => makeSubject(name, i)),
    currentId: null
  };

  const homeView = document.getElementById('home-view');
  const subjectView = document.getElementById('subject-view');
  const grid = document.getElementById('subject-grid');

  let addingSubject = false;

  function renderHome(){
    grid.innerHTML = '';
    state.subjects.forEach(sub => {
      const card = document.createElement('div');
      card.className = 'subject-card';
      card.tabIndex = 0;
      card.innerHTML = `
        <div class="tab" style="background:${sub.color}"></div>
        <button class="del-btn" title="科目を削除">✕</button>
        <div class="name">${escapeHtml(sub.name)}</div>
        <div class="count">${sub.githubItems.length} 件の資料</div>
      `;
      card.addEventListener('click', (e) => {
        if (e.target.classList.contains('del-btn')) return;
        openSubject(sub.id);
      });
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter') openSubject(sub.id); });

      const delBtn = card.querySelector('.del-btn');
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (delBtn.classList.contains('confirming')){
          state.subjects = state.subjects.filter(s => s.id !== sub.id);
          renderHome();
        } else {
          delBtn.classList.add('confirming');
          delBtn.textContent = '削除確定';
          setTimeout(() => {
            delBtn.classList.remove('confirming');
            delBtn.textContent = '✕';
          }, 3000);
        }
      });
      grid.appendChild(card);
    });

    grid.appendChild(buildAddCard());
  }

  // prompt()を使わず、カード内に直接フォームを表示して科目を追加する
  function buildAddCard(){
    const addCard = document.createElement('div');
    addCard.className = 'add-card';

    if (!addingSubject){
      addCard.textContent = '＋ 科目を追加';
      addCard.addEventListener('click', () => {
        addingSubject = true;
        renderHome();
        const input = document.getElementById('new-subject-input');
        if (input) input.focus();
      });
      return addCard;
    }

    addCard.classList.add('editing');
    addCard.innerHTML = `
      <input type="text" id="new-subject-input" placeholder="科目名を入力">
      <div class="add-form-buttons">
        <button type="button" class="confirm-btn">追加</button>
        <button type="button" class="cancel-btn">キャンセル</button>
      </div>
    `;

    const input = addCard.querySelector('#new-subject-input');
    const confirmAdd = () => {
      const name = input.value.trim();
      if (name){
        state.subjects.push(makeSubject(name, state.subjects.length));
      }
      addingSubject = false;
      renderHome();
    };
    addCard.querySelector('.confirm-btn').addEventListener('click', confirmAdd);
    addCard.querySelector('.cancel-btn').addEventListener('click', () => {
      addingSubject = false;
      renderHome();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') confirmAdd();
      if (e.key === 'Escape'){ addingSubject = false; renderHome(); }
    });

    return addCard;
  }

  function openSubject(id){
    state.currentId = id;
    homeView.style.display = 'none';
    subjectView.style.display = 'block';
    renderSubjectHeader();
    renderUploadArea();
    loadGithubItems();
    window.scrollTo(0,0);
  }

  function backHome(){
    state.currentId = null;
    subjectView.style.display = 'none';
    homeView.style.display = 'block';
    renderHome();
  }
  document.getElementById('back-btn').addEventListener('click', backHome);

  function getCurrentSubject(){ return state.subjects.find(s => s.id === state.currentId); }

  function renderSubjectHeader(){
    const sub = getCurrentSubject();
    document.getElementById('subject-title').textContent = sub.name;
    document.getElementById('subject-tab-chip').style.background = sub.color;
  }

  // ---------- 「新しくアップロードする」エリア ----------
  // ※ フォルダの中身一覧（embeddedfolderview）は表示しません。
  //    Googleのその埋め込みウィジェットは「最終更新者」のアイコンが常に表示され、
  //    こちら側でその表示だけを消すことができない（Google側の仕様で、外部サイトから
  //    iframeの中身をCSS等で編集することはできません）ためです。
  //    ボタン経由でDrive自体を開いてアップロードしてもらう方式にしています。
  function renderUploadArea(){
    const sub = getCurrentSubject();
    const area = document.getElementById('upload-area');
    const desc = document.getElementById('upload-desc');
    const url = DRIVE_UPLOAD_FOLDERS[sub.name];

    if (!url){
      desc.textContent = 'このHTMLで指定されたGoogleドライブのアップロード先が設定されると、ここにボタンが表示されます。';
      area.innerHTML = `
        <div class="unset-note">
          「${escapeHtml(sub.name)}」のアップロード先が未設定です。<br>
          script内の <code>DRIVE_UPLOAD_FOLDERS</code> に <code>"${escapeHtml(sub.name)}": "フォルダのURL"</code> を追加してください。
        </div>`;
      return;
    }

    desc.textContent = '下のボタンからGoogleドライブのフォルダを開いて、教材を直接アップロードできます。フォルダの中身は下に一覧表示されます。';

    const folderId = extractDriveFolderId(url);
    const embedHtml = folderId
      ? `<div class="upload-embed">
           <div class="embed-label">フォルダの中身（自動更新）</div>
           <iframe src="https://drive.google.com/embeddedfolderview?id=${folderId}#list" loading="lazy"></iframe>
           <div class="embed-fallback-note">スマートフォンでは、この一覧がうまく表示されない場合があります（Google側の仕様によるものです）。うまく表示されない時は、上の「Googleドライブでアップロードする」ボタンからDriveアプリ・ブラウザで直接フォルダを開いてください。</div>
         </div>`
      : '';

    area.innerHTML = `
      <a class="upload-btn-link" href="${url}" target="_blank" rel="noopener">📁 Googleドライブでアップロードする</a>
      ${embedHtml}
    `;
  }

  function extractDriveFolderId(url){
    const m = url.match(/\/folders\/([-\w]{10,})/);
    return m ? m[1] : null;
  }

  // ---------- GitHubからのPDF自動読み込み（この科目の資料） ----------
  document.getElementById('github-refresh-btn').addEventListener('click', loadGithubItems);

  async function loadGithubItems(){
    const sub = getCurrentSubject();
    const statusEl = document.getElementById('github-status');

    if (!GITHUB_CONFIG.enabled){
      statusEl.textContent = 'GitHub連携：未設定です（script内のGITHUB_CONFIGを編集してください）';
      sub.githubItems = [];
      renderItemList();
      return;
    }

    statusEl.textContent = '読み込み中…';

    const path = `${GITHUB_CONFIG.folder}/${encodeURIComponent(sub.name)}`;
    const api = `https://api.github.com/repos/${GITHUB_CONFIG.user}/${GITHUB_CONFIG.repo}/contents/${path}?ref=${GITHUB_CONFIG.branch}`;

    try{
      const res = await fetch(api);
      if (!res.ok){
        sub.githubItems = [];
        statusEl.textContent = res.status === 404
          ? `フォルダ「${path}」が見つかりません。リポジトリ内に作成してPDFを置いてください。`
          : `読み込みに失敗しました（status: ${res.status}）`;
        renderItemList();
        return;
      }
      const data = await res.json();
      const pdfs = Array.isArray(data)
        ? data.filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.pdf'))
        : [];

      sub.githubItems = pdfs.map(f => ({
        id: 'gh-' + f.sha,
        name: f.name,
        embedUrl: f.download_url,
        rawUrl: f.download_url
      }));

      statusEl.textContent = `${pdfs.length} 件のPDFを読み込みました（${path}）`;
      renderItemList();
    } catch(err){
      statusEl.textContent = '読み込み中にエラーが発生しました。ネットワークまたはリポジトリ設定をご確認ください。';
      sub.githubItems = [];
      renderItemList();
    }
  }

  function renderItemList(){
    const sub = getCurrentSubject();
    const list = document.getElementById('item-list');
    const emptyNote = document.getElementById('empty-note');
    list.innerHTML = '';

    if (sub.githubItems.length === 0){
      emptyNote.style.display = 'block';
      return;
    }
    emptyNote.style.display = 'none';

    sub.githubItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `
        <div class="item-head">
          <div class="item-name"><span class="badge">PDF</span>${escapeHtml(item.name)}</div>
          <div class="item-actions">
            <button class="toggle-preview">プレビュー</button>
            <a href="${item.rawUrl}" target="_blank" rel="noopener">開く</a>
          </div>
        </div>
        <div class="preview-box"></div>
      `;
      const previewBox = card.querySelector('.preview-box');
      const toggleBtn = card.querySelector('.toggle-preview');

      toggleBtn.addEventListener('click', () => {
        const isOpen = previewBox.classList.contains('open');
        if (isOpen){
          previewBox.classList.remove('open');
          previewBox.innerHTML = '';
          toggleBtn.textContent = 'プレビュー';
        } else {
          previewBox.innerHTML = `<iframe class="pdf-frame" src="${item.embedUrl}" loading="lazy"></iframe>`;
          previewBox.classList.add('open');
          toggleBtn.textContent = '閉じる';
        }
      });

      list.appendChild(card);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  renderHome();
</script>
